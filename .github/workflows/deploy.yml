# Build the site on every push to main and publish it with GitHub Pages.
# One-time repository setting: Settings -> Pages -> Source: "GitHub Actions".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc-3.11-1-amd64.deb
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
