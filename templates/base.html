<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.name }}, {{ site.title }}.{% endblock %}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/style.css">
{% block head %}{% endblock %}
{% if site.goatcounter %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{% endif %}
</head>
<body class="page-{{ page }}">
<header class="masthead">
  <a class="wordmark" href="/">{{ site.name }}</a>
  <nav>
    {% if page == "home" %}<a href="#publications">Publications</a>{% else %}<a href="/#publications">Publications</a>{% endif %}
    {% if posts or page in ("post", "blog") %}<a href="/blog/"{% if page in ("post", "blog") %} aria-current="page"{% endif %}>Blog</a>{% endif %}
    <a href="{{ site.cv }}">CV</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="colophon">
  <span>© {{ year }} {{ site.name }}</span>
  <span>Updated {{ updated }}</span>
</footer>
</body>
</html>
