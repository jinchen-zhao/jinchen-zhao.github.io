bio: |
  I am a PhD student in Applied Physics at Yale University, advised by
  [Logan Wright](https://www.lgwrightlab.com/). I work on unconventional computing
  platforms (optical, quantum and thermodynamic) in both theory and experiment.
  I am also interested in machine learning and using large language models to
  automate scientific research.

